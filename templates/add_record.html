{% extends "base.html" %}
{% block content %}
{% set cs = settings.currency_symbol if settings else '¥' %}

<h4 class="fw-bold mb-3"><i class="bi bi-plus-circle"></i> 记一笔账</h4>
<div class="card p-4">
    <form method="post" enctype="multipart/form-data">
        <div class="mb-4">
            <label class="form-label fw-bold">类型</label>
            <div class="d-flex gap-2">
                <input type="radio" class="btn-check" name="type" id="typeExpense" value="expense" checked>
                <label class="btn btn-outline-danger flex-fill py-2" for="typeExpense"><i class="bi bi-arrow-up-circle"></i> 支出</label>
                <input type="radio" class="btn-check" name="type" id="typeIncome" value="income">
                <label class="btn btn-outline-success flex-fill py-2" for="typeIncome"><i class="bi bi-arrow-down-circle"></i> 收入</label>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-bookmark"></i> 分类</label>
                <select name="category_id" id="categorySelect" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" data-type="{{ cat.type }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-wallet2"></i> 账户</label>
                <select name="account_id" class="form-select">
                    <option value="">无</option>
                    {% for ac in accounts %}
                    <option value="{{ ac.id }}" {% if default_account_id == ac.id %}selected{% endif %}>{{ ac.icon }} {{ ac.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold"><i class="bi bi-currency-exchange"></i> 金额</label>
            <div class="input-group input-group-lg">
                <span class="input-group-text">{{ cs }}</span>
                <input type="number" step="0.01" name="amount" class="form-control form-control-lg" placeholder="0.00" required>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-calendar"></i> 日期</label>
                <input type="date" name="date" id="dateInput" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-bold"><i class="bi bi-tags"></i> 标签
                    <a href="/tags" class="small text-muted fw-normal">管理</a>
                </label>
                <div class="d-flex flex-wrap gap-1" style="max-height: 100px; overflow-y: auto;">
                    {% for tag in tags %}
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="tags" value="{{ tag.id }}" id="tag{{ tag.id }}">
                        <label class="form-check-label small" for="tag{{ tag.id }}">
                            <span class="d-inline-block rounded-circle me-1" style="width: 8px; height: 8px; background: {{ tag.color }};"></span>
                            {{ tag.name }}
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold"><i class="bi bi-card-text"></i> 备注</label>
            <input type="text" name="description" class="form-control" placeholder="例如：午餐、地铁...">
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold"><i class="bi bi-camera"></i> 收据/图片</label>
            <input type="file" name="image" id="imageInput" class="form-control" accept="image/*" capture="environment">
            <small class="text-muted">支持 JPG/PNG 格式，最大 16MB</small>
            <div id="imagePreview" class="mt-2 d-none">
                <img src="#" alt="预览" class="rounded border" style="max-width: 200px; max-height: 200px; object-fit: cover;">
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="bi bi-check-lg"></i> 保存记录</button>
    </form>
</div>

<script>
    document.getElementById('dateInput').valueAsDate = new Date();

    const typeRadios = document.getElementsByName('type');
    const catSelect = document.getElementById('categorySelect');
    const options = catSelect.options;

    function filterCategories() {
        const selectedType = document.querySelector('input[name="type"]:checked').value;
        let firstVisible = null;
        for (let opt of options) {
            if (opt.getAttribute('data-type') === selectedType) {
                opt.style.display = 'block';
                if (!firstVisible) firstVisible = opt;
            } else {
                opt.style.display = 'none';
            }
        }
        if (firstVisible) firstVisible.selected = true;
    }

    typeRadios.forEach(r => r.addEventListener('change', filterCategories));
    window.onload = filterCategories;

    document.getElementById('imageInput').addEventListener('change', function() {
        const preview = document.getElementById('imagePreview');
        if (this.files && this.files[0]) {
            preview.classList.remove('d-none');
            preview.querySelector('img').src = URL.createObjectURL(this.files[0]);
        } else {
            preview.classList.add('d-none');
        }
    });
</script>
{% endblock %}
